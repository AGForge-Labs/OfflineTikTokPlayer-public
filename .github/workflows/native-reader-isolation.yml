name: Native reader independence diagnostic
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-reader-isolation.yml', 'scripts/check-native-reader-isolation.sh']
permissions:
  contents: read
jobs:
  native-reader-isolation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unsigned controlled native-read independence with one build job
        run: bash scripts/check-native-reader-isolation.sh
      - name: Require the exact native independence identity
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('evidence', 'scripts/verify-native-test-log.py')
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          expected = {'OfflineTikTokPlayerTests.ContinuousPCMDecoderTests/testHeldNeighbourNativeReadDoesNotPreventPreparedCurrentSourceRefill'}
          if not expected.issubset(evidence.source_manifest(Path('.'))):
              raise SystemExit('Controlled independence identity missing from source')
          evidence.verify_log(Path('artifacts/native/xcodebuild-test.log').read_text(), expected)
          print('SCOPED native-read independence native=1 ui=0; SDK wait cause/full playback acceptance NOT ESTABLISHED')
          PY
