name: Native reader independence diagnostic
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-reader-isolation.yml', 'scripts/check-native-reader-isolation.sh']
permissions:
  contents: read
jobs:
  native-reader-isolation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unsigned decoder independence and parity with one build job
        run: bash scripts/check-native-reader-isolation.sh
      - name: Require all eighteen exact decoder identities
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('evidence', 'scripts/verify-native-test-log.py')
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          expected = {identity for identity in evidence.source_manifest(Path('.'))
                      if identity.startswith('OfflineTikTokPlayerTests.ContinuousPCMDecoderTests/')}
          if len(expected) != 18:
              raise SystemExit('Decoder identity count must equal eighteen')
          evidence.verify_log(Path('artifacts/native/xcodebuild-test.log').read_text(), expected)
          print('SCOPED decoder independence/parity native=18 ui=0; SDK wait cause/full playback acceptance NOT ESTABLISHED')
          PY
