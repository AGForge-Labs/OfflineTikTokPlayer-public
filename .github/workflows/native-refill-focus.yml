name: Native refill focused fresh-host controls
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-refill-focus.yml', 'scripts/check-native-refill-focus.sh']
permissions:
  contents: read
jobs:
  native-refill-focus:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/native-reader-isolation' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Require exact committed app and test source
        id: source_pin
        run: bash scripts/check-native-refill-focus.sh --verify-source
      - name: Preserve strict native evidence and both harness regression routes
        id: harness
        if: ${{ always() && steps.source_pin.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          python3 tests/validation-shell/test_check_ios_shell.py
          python3 tests/validation-shell/test_native_test_evidence.py
          python3 tests/validation-shell/test_native_control_harness.py
          python3 tests/validation-shell/test_native_refill_focus_harness.py
      - name: Initialize read-only simulator inventory within sixty seconds
        id: simulator_inventory
        if: ${{ always() && steps.harness.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['xcrun', 'simctl', 'list', 'devices', 'available', '--json'],
                         capture_output=True, text=True, check=True, timeout=60)
          print('Read-only simulator inventory initialized; exact destination and host guards remain required.')
          PY
      - name: Compile once then run four fixed fresh-host singleton controls without capture
        if: ${{ always() && steps.source_pin.outcome == 'success' && steps.harness.outcome == 'success' && steps.simulator_inventory.outcome == 'success' }}
        run: bash scripts/check-native-refill-focus.sh controls
      - name: Require four exact singleton identities and all native and host receipts
        if: ${{ always() && steps.source_pin.outcome == 'success' }}
        run: bash scripts/check-native-refill-focus.sh --verify-controls
