name: Audio output continuity regressions
run-name: Audio recovery with unchanged transition and video pipelines
on:
  push:
    branches: [codex/audio-continuity-confirmation]
permissions:
  contents: read
concurrency:
  group: audio-output-continuity
  cancel-in-progress: false
jobs:
  audio:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.actor_id == '105477711' }}
    runs-on: macos-26
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify the audio-only change and preserved playback pipeline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ios/OfflineTikTokPlayer)" = a8eb0a2051c8cb2aa79c43432e4130ad289301ee
          test "$(git rev-parse HEAD:ios/PlayerCore)" = f9b20964220eb867c397e9fa8334c673263d92a5
          python3 -B scripts/generate-ios-project.py --check
          python3 - <<'PY'
          import subprocess, json, runpy
          from pathlib import Path
          baseline = '30c1a5d36da393743cd3155ac991a2221eb7a7bc'
          delta = subprocess.check_output(['git','diff','--name-only',baseline,'HEAD','--','ios/OfflineTikTokPlayer'],text=True).splitlines()
          assert delta == ['ios/OfflineTikTokPlayer/Playback/ContinuousAudioPlayer.swift','ios/OfflineTikTokPlayer/Playback/PlaybackService.swift']
          path = 'ios/OfflineTikTokPlayer/Playback/ContinuousAudioPlayer.swift'
          accessor = '    var playbackControlRevision: UInt64 { playbackControlTicket }\n'
          current = Path(path).read_text()
          assert current.count(accessor) == 1
          assert current.replace(accessor, '', 1) == subprocess.check_output(['git','show',baseline+':'+path],text=True)
          profile = json.loads(Path('tests/audio-output-continuity.json').read_text())
          cases = set(profile['cases'])
          verifier = runpy.run_path('scripts/verify-native-test-log.py')
          assert profile['version'] == 1 and len(cases) == len(profile['cases']) == 18
          assert cases <= verifier['source_manifest'](Path('.'))
          assert all(case.startswith('OfflineTikTokPlayerTests.') for case in cases)
          selected = ["-only-testing:" + case.replace('.', '/', 1) for case in sorted(cases)]
          folder = Path('artifacts/audio-output'); folder.mkdir(parents=True, exist_ok=True)
          (folder / 'selectors.txt').write_text('\n'.join(selected) + '\n')
          print('AUDIO_UNCHANGED_PIPELINE core=f9b20964220eb867c397e9fa8334c673263d92a5 renderer=unchanged decoder=unchanged dsp=unchanged video=unchanged')
          PY
      - name: Begin one exact simulator boot
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices = [(runtime, d) for runtime, values in devices.items() for d in values if d['name'] == 'iPhone 17 Pro Max' and d['isAvailable']]
          assert choices
          _, device = sorted(choices, key=lambda p: p[0])[-1]
          if device['state'] != 'Booted': subprocess.run(['xcrun','simctl','boot',device['udid']],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_UDID='+device['udid']+'\n')
          PY
      - name: Compile the focused audio tests once
        id: build
        run: |
          set -euo pipefail
          mkdir -p artifacts/audio-output
          excluded="$(python3 -c 'from pathlib import Path; chosen={"AudioOutputContinuityTests.swift", "PhonePlaybackReliabilityTests.swift", "AudioOnlyContinuityTests.swift", "ContinuousAudioGraphTests.swift", "ContinuousAudioPlayerTests.swift", "PictureRecoveryTests.swift", "FeedPresentationTests.swift", "VideoPresentationContinuityTests.swift", "PlaybackSelectionVideoRegressionTests.swift", "NativeReaderWaitObservation.swift"}; files=list(Path("ios/OfflineTikTokPlayerTests").glob("*.swift")); assert chosen <= {p.name for p in files}; print(" ".join(sorted(p.name for p in files if p.name not in chosen)))')"
          xcodebuild -project ios/OfflineTikTokPlayer.xcodeproj -scheme OfflineTikTokPlayer -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath artifacts/AudioOutputDerived -resultBundlePath artifacts/audio-output/Build.xcresult \
            -jobs 2 CODE_SIGNING_ALLOWED=NO "EXCLUDED_SOURCE_FILE_NAMES=$excluded" \
            build-for-testing 2>&1 | tee artifacts/audio-output/build.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          plans = list(Path('artifacts/AudioOutputDerived/Build/Products').glob('*.xctestrun'))
          assert len(plans) == 1 and plans[0].is_file() and not plans[0].is_symlink()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('NATIVE_XCTESTRUN=' + str(plans[0].resolve()) + '\n')
          PY
      - name: Verify audio recovery and existing loop switching and video controls
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          capture_log=artifacts/audio-output/capture-helper.log
          capture_pid=''
          cleanup_capture() {
            local status=$?
            trap - EXIT
            if [ -n "$capture_pid" ]; then
              kill "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup_capture EXIT
          python3 -u scripts/capture-simulator-test-frames.py \
            --udid "$SIMULATOR_UDID" --lifetime 600 >"$capture_log" 2>&1 &
          capture_pid=$!
          capture_ready=0
          for ((attempt=0; attempt<100; attempt++)); do
            kill -0 "$capture_pid" 2>/dev/null || { cat "$capture_log"; exit 1; }
            if grep -Fq '"eventCode": 0' "$capture_log"; then capture_ready=1; break; fi
            sleep 0.1
          done
          if [ "$capture_ready" -ne 1 ]; then cat "$capture_log"; exit 1; fi
          selectors=()
          while IFS= read -r selector; do selectors+=("$selector"); done < artifacts/audio-output/selectors.txt
          test "${#selectors[@]}" = 18
          xcodebuild test-without-building -xctestrun "$NATIVE_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath artifacts/audio-output/Native.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 60 \
            "${selectors[@]}" \
            2>&1 | tee artifacts/audio-output/native.log
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          verifier = runpy.run_path('scripts/verify-native-test-log.py')
          profile = json.loads(Path('tests/audio-output-continuity.json').read_text())
          cases = set(profile['cases'])
          assert profile['version'] == 1 and len(cases) == len(profile['cases']) == 18
          assert cases <= verifier['source_manifest'](Path('.'))
          verifier['verify_log'](Path('artifacts/audio-output/native.log').read_text(), cases, invocation='test-without-building')
          print('AUDIO_OUTPUT_NATIVE_VERIFIED cases=18')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: audio-output-native-logs
          path: artifacts/audio-output/*.log
          retention-days: 1
