name: Same retained asset admission with isolated playback processes
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-playback-targeted.yml', 'scripts/check-native-playback-targeted.sh', 'scripts/export-native-control-results.py', 'tests/validation-shell/test_native_control_harness.py', 'tests/validation-shell/test_native_control_results.py']
concurrency:
  group: offline-player-native-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-playback-targeted:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/native-reader-isolation' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact committed source before native work
        id: source_pin
        run: bash scripts/check-native-playback-targeted.sh --verify-source
      - name: Portable Core regressions
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: bash scripts/test-core.sh
      - name: Preserve launcher and strict evidence and isolated-host regression gates
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 tests/validation-shell/test_check_ios_shell.py
          python3 tests/validation-shell/test_native_test_evidence.py
          python3 tests/validation-shell/test_native_control_harness.py
          python3 tests/validation-shell/test_native_control_results.py
          python3 tests/validation-shell/test_simulator_boot_preflight.py
          python3 tests/validation-shell/test_simulator_destination_resolution.py
          python3 tests/validation-shell/test_native_xcresult_export.py
      - name: Resolve within sixty seconds and boot within four minutes
        id: simulator_boot
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          simulator_id="$(python3 scripts/capture-simulator-test-frames.py --resolve-destination 'platform=iOS Simulator,name=iPhone 17 Pro Max')"
          python3 scripts/ensure-simulator-booted.py --udid "$simulator_id"
      - name: Build one exact test plan and calibrate actual admission and close ordering
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: bash scripts/check-native-playback-targeted.sh benchmark
      - name: Require the actual same-asset calibration identity
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('evidence', 'scripts/verify-native-test-log.py')
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          prefix = 'OfflineTikTokPlayerTests.ContinuousPCMDecoderTests/'
          expected = {prefix + 'testSameRetainedAssetAdmissionWaitsForActualRetiredReaderClose'}
          if len(expected) != 1 or not expected.issubset(evidence.source_manifest(Path('.'))):
              raise SystemExit('The same-asset actual-read/close calibration must exist in pinned source')
          evidence.verify_log(Path('artifacts/native/native-playback-benchmark.log').read_text(), expected, invocation='test-without-building')
          print('Same-asset calibration identity native=1 ui=0; original guards retained; no physical-output/full acceptance claim')
          PY
      - name: Four OFF ON ON OFF arms with fresh exact owned hosts and calibration-built products
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: bash scripts/check-native-playback-targeted.sh controls
      - name: Require all four singleton identities and native exit and host-boundary receipts
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: bash scripts/check-native-playback-targeted.sh --verify-controls
      - name: Export each exact attempted structured result independently
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: python3 scripts/export-native-control-results.py
