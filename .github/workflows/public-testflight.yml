name: Owner public source to private TestFlight
on:
  workflow_dispatch:
    inputs:
      authorize_upload:
        description: Sign and upload this exact accepted commit to existing internal TestFlight only
        required: true
        type: boolean
        default: false
      expected_commit:
        description: Exact reviewed 40-character main commit, including this workflow
        required: true
        type: string
      build_number:
        description: Apple build number newer than every existing build; public run numbers are independent
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-testflight-release
  cancel-in-progress: false
env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
  RELEASE_AUTHORIZED: ${{ inputs.authorize_upload }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.authorize_upload &&
      github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && !github.event.repository.private &&
      github.actor_id == '105477711' && github.triggering_actor == 'Galaxybigbird' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact owner-reviewed public source
        run: python3 -B scripts/public-release.py check
      - name: Release gate regression checks
        run: python3 -B -m unittest discover -s tests/release -v
      - name: Keep native launcher and evidence checks fail closed
        run: |
          python3 -B tests/validation-shell/test_check_ios_shell.py
          python3 -B tests/validation-shell/test_native_test_evidence.py
      - name: Preserve existing native and source regression checks
        shell: bash
        run: bash scripts/check-ios.sh
      - name: Require every native and UI test identity independently
        run: python3 -B scripts/verify-native-test-log.py --log artifacts/native/xcodebuild-test.log
  release:
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    environment:
      name: release
    runs-on: macos-26
    timeout-minutes: 35
    env:
      RELEASE_ENVIRONMENT: release
      RELEASE_ACCEPTED_COMMIT: ${{ vars.RELEASE_ACCEPTED_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sign, verify and upload without public package or raw signing logs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: python3 -B scripts/public-release.py sign-upload
