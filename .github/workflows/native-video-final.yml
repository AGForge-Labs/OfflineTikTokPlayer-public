name: Public final video presentation verification
on:
  push:
    branches: [codex/native-video-final]
    paths: ['ios/**', 'tests/native-video-format-cases.json', '.github/workflows/native-video-final.yml']
permissions:
  contents: read
concurrency:
  group: native-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  presentation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact runtime and project
        run: |
          test "$(git rev-parse HEAD:ios/OfflineTikTokPlayer)" = ce76fdd2a2665b0e4ca131dcaca3a8f1906ff650
          test "$(git rev-parse HEAD:ios/PlayerCore)" = f9b20964220eb867c397e9fa8334c673263d92a5
          python3 scripts/generate-ios-project.py --check
      - name: Begin simulator boot before compilation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices = [(runtime, d) for runtime, values in devices.items() for d in values if d['name'] == 'iPhone 17 Pro Max' and d['isAvailable']]
          assert choices
          _, device = sorted(choices, key=lambda p: p[0])[-1]
          if device['state'] != 'Booted': subprocess.run(['xcrun','simctl','boot',device['udid']],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_UDID='+device['udid']+'\n')
          PY
      - name: Real images rapid reversals and source frame pacing
        id: native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-format
          # The capture bridge and xcodebuild share one exact booted Simulator.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          capture_log=artifacts/native-format/capture-helper.log
          capture_pid=''
          cleanup_capture() {
            local status=$?
            trap - EXIT
            if [ -n "$capture_pid" ]; then
              kill "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup_capture EXIT
          python3 -u scripts/capture-simulator-test-frames.py \
            --udid "$SIMULATOR_UDID" --lifetime 1200 >"$capture_log" 2>&1 &
          capture_pid=$!
          capture_ready=0
          for ((attempt=0; attempt<100; attempt++)); do
            kill -0 "$capture_pid" 2>/dev/null || { cat "$capture_log"; exit 1; }
            if grep -Fq '"eventCode": 0' "$capture_log"; then capture_ready=1; break; fi
            sleep 0.1
          done
          if [ "$capture_ready" -ne 1 ]; then cat "$capture_log"; exit 1; fi
          excluded="$(python3 -c 'from pathlib import Path; chosen={"PictureRecoveryTests.swift", "FeedPresentationTests.swift", "VideoPresentationContinuityTests.swift", "PlaybackSelectionVideoRegressionTests.swift", "NativeReaderWaitObservation.swift"}; files=list(Path("ios/OfflineTikTokPlayerTests").glob("*.swift")); assert chosen <= {p.name for p in files}; print(" ".join(sorted(p.name for p in files if p.name not in chosen)))')"
          xcodebuild -project ios/OfflineTikTokPlayer.xcodeproj -scheme OfflineTikTokPlayer -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath artifacts/NativeFormatDerived -resultBundlePath artifacts/native-format/Native.xcresult \
            -jobs 2 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 90 CODE_SIGNING_ALLOWED=NO "EXCLUDED_SOURCE_FILE_NAMES=$excluded" \
            -only-testing:OfflineTikTokPlayerTests/FeedPresentationTests \
            -only-testing:OfflineTikTokPlayerTests/PictureRecoveryTests \
            -only-testing:OfflineTikTokPlayerTests/VideoPresentationContinuityTests \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testInitialZeroClockBindingExplicitSeekDuringReadyAcceptanceWithFirstCopiedPixelTrace \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testMutedNativeTimingPreservesRetainedVideoAndPCM \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testNativeStartArgumentNumericThenCurrentItemTime \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testNativeTimingConfigurationCannotUndoPauseOrDeniedInterruptionResume \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testNativeTimingConfigurationRejectsSupersessionAtEveryPrewriteRead \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testPausedFirstPixelAuditDistinguishesGeneratedInitialAndTargetMarkerBins \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testPreparedABAChangesActualAssetAudioTokenAndCompositePixels \
            -only-testing:OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests/testPreparedNextVideoFirstFrameCapabilityBeforeSelection \
            test 2>&1 | tee artifacts/native-format/native.log
      - name: Require thirty one exact passing cases
        shell: bash
        run: |
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          v = runpy.run_path('scripts/verify-native-test-log.py')
          cases = set(json.loads(Path('tests/native-video-format-cases.json').read_text())['cases'])
          assert len(cases) == 31 and cases <= v['source_manifest'](Path.cwd())
          v['verify_log'](Path('artifacts/native-format/native.log').read_text(), cases)
          print('Exact31 focused presentation and ownership cases passed; phone cadence acceptance remains separate.')
          PY
      - name: Preserve synthetic video evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-format-evidence
          path: artifacts/native-format
          retention-days: 1
