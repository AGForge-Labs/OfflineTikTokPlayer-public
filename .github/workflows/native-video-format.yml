name: Public native-format video pacing
on:
  push:
    branches: [codex/native-video-format]
    paths: ['ios/**', '.github/workflows/native-video-format.yml']
permissions:
  contents: read
concurrency:
  group: native-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  presentation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact runtime and project
        run: |
          test "$(git rev-parse HEAD:ios/OfflineTikTokPlayer)" = 988b7b6d7912dedf016969e76cc626edf1ed8ae8
          test "$(git rev-parse HEAD:ios/PlayerCore)" = f9b20964220eb867c397e9fa8334c673263d92a5
          python3 scripts/generate-ios-project.py --check
      - name: Real images rapid reversals and source frame pacing
        id: native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-format
          excluded="$(python3 -c 'from pathlib import Path; chosen={"PictureRecoveryTests.swift", "FeedPresentationTests.swift", "VideoPresentationContinuityTests.swift"}; files=list(Path("ios/OfflineTikTokPlayerTests").glob("*.swift")); assert chosen <= {p.name for p in files}; print(" ".join(sorted(p.name for p in files if p.name not in chosen)))')"
          xcodebuild -project ios/OfflineTikTokPlayer.xcodeproj -scheme OfflineTikTokPlayer -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath artifacts/NativeFormatDerived -resultBundlePath artifacts/native-format/Native.xcresult \
            -jobs 1 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO "EXCLUDED_SOURCE_FILE_NAMES=$excluded" \
            -only-testing:OfflineTikTokPlayerTests/FeedPresentationTests \
            -only-testing:OfflineTikTokPlayerTests/PictureRecoveryTests \
            -only-testing:OfflineTikTokPlayerTests/VideoPresentationContinuityTests \
            test 2>&1 | tee artifacts/native-format/native.log
      - name: Require twenty exact passing cases
        shell: bash
        run: |
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          v = runpy.run_path('scripts/verify-native-test-log.py')
          cases = set(json.loads(Path('tests/frame-pacing-cases.json').read_text())['full'])
          assert len(cases) == 20 and cases <= v['source_manifest'](Path.cwd())
          v['verify_log'](Path('artifacts/native-format/native.log').read_text(), cases)
          print('Exact20 presentation cases passed; phone cadence acceptance remains separate.')
          PY
      - name: Preserve synthetic video evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-format-evidence
          path: artifacts/native-format
          retention-days: 1
