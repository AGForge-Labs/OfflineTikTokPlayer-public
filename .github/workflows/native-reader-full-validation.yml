name: Native reader full validation
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-reader-full-validation.yml', 'scripts/check-native-reader-full-validation.sh', 'scripts/ensure-simulator-booted.py', 'tests/validation-shell/test_simulator_boot_preflight.py', 'scripts/test-apple-buffer.sh', 'scripts/generate-apple-buffer-resources.py', 'tests/validation-shell/test_apple_buffer_projection.py', 'scripts/capture-simulator-test-frames.py', 'tests/validation-shell/test_simulator_destination_resolution.py']
permissions:
  contents: read
jobs:
  native-reader-full-validation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/native-reader-isolation' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Require exact committed app and test source before native work
        id: source_pin
        run: |
          mkdir -p artifacts/native
          bash scripts/check-native-reader-full-validation.sh --verify-source
      - name: Preserve native launcher, strict evidence and exact boot regressions
        id: harness
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 tests/validation-shell/test_check_ios_shell.py
          python3 tests/validation-shell/test_native_test_evidence.py
          python3 tests/validation-shell/test_simulator_boot_preflight.py
          python3 tests/validation-shell/test_apple_buffer_projection.py
          python3 tests/validation-shell/test_simulator_destination_resolution.py
      - name: Resolve the Simulator then verify boot within a four minute budget
        id: simulator_boot
        if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
        run: |
          simulator_id="$(python3 scripts/capture-simulator-test-frames.py --resolve-destination 'platform=iOS Simulator,name=iPhone 17 Pro Max')"
          python3 scripts/ensure-simulator-booted.py --udid "$simulator_id"
          printf 'simulator_id=%s\n' "$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run every unsigned native and UI regression with one build job
        id: native
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' && steps.harness.outcome == 'success' && steps.simulator_boot.outcome == 'success' }}
        env:
          SIMULATOR_DESTINATION: platform=iOS Simulator,id=${{ steps.simulator_boot.outputs.simulator_id }}
        run: bash scripts/check-native-reader-full-validation.sh
      - name: Independently require all 128 native and one UI identities after the attempt
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('evidence', 'scripts/verify-native-test-log.py')
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          expected = evidence.source_manifest(Path('.'))
          native = {identity for identity in expected if identity.startswith('OfflineTikTokPlayerTests.')}
          ui = {identity for identity in expected if identity.startswith('OfflineTikTokPlayerUITests.')}
          if len(native) != 128 or len(ui) != 1 or native | ui != expected:
              raise SystemExit(f'Pinned full manifest must equal native=128 ui=1; found native={len(native)} ui={len(ui)} total={len(expected)}')
          evidence.verify_log(Path('artifacts/native/xcodebuild-test.log').read_text(), expected)
          print('FULL source-manifest evidence native=128 ui=1; original guards retained; physical-device acceptance remains separate')
          PY
