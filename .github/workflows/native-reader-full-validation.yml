name: Native reader full validation
on:
  push:
    branches: [diagnostic/native-reader-isolation]
    paths: ['.github/workflows/native-reader-full-validation.yml', 'scripts/check-native-reader-full-validation.sh', 'scripts/check-ios.sh', 'scripts/run-owned-xcodebuild.py', 'tests/validation-shell/test_check_ios_shell.py', 'tests/validation-shell/test_owned_xcodebuild_deadline.py', 'scripts/ensure-simulator-booted.py', 'tests/validation-shell/test_simulator_boot_preflight.py', 'scripts/test-apple-buffer.sh', 'scripts/generate-apple-buffer-resources.py', 'tests/validation-shell/test_apple_buffer_projection.py', 'scripts/capture-simulator-test-frames.py', 'tests/validation-shell/test_simulator_destination_resolution.py', 'scripts/export-native-xcresult.py', 'tests/validation-shell/test_native_xcresult_export.py', 'scripts/preroll-crash-excerpt.py', 'scripts/export-preroll-crash-evidence.py', 'tests/validation-shell/test_preroll_crash_evidence.py']
permissions:
  contents: read
concurrency:
  group: offline-player-native-validation
  cancel-in-progress: true
jobs:
  native-reader-full-validation:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/native-reader-isolation' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Require exact committed app and test source before native work
        id: source_pin
        run: |
          mkdir -p artifacts/native
          bash scripts/check-native-reader-full-validation.sh --verify-source
      - name: Preserve native launcher, strict evidence and exact boot regressions
        id: harness
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 tests/validation-shell/test_check_ios_shell.py
          python3 tests/validation-shell/test_owned_xcodebuild_deadline.py
          python3 tests/validation-shell/test_native_test_evidence.py
          python3 tests/validation-shell/test_simulator_boot_preflight.py
          python3 tests/validation-shell/test_apple_buffer_projection.py
          python3 tests/validation-shell/test_simulator_destination_resolution.py
          python3 tests/validation-shell/test_native_xcresult_export.py
          python3 tests/validation-shell/test_preroll_crash_evidence.py
      - name: Resolve the Simulator then verify boot within a four minute budget
        id: simulator_boot
        if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
        run: |
          simulator_id="$(python3 scripts/capture-simulator-test-frames.py --resolve-destination 'platform=iOS Simulator,name=iPhone 17 Pro Max')"
          python3 scripts/ensure-simulator-booted.py --udid "$simulator_id"
          printf 'simulator_id=%s\n' "$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run every unsigned native and UI regression with one build job
        id: native
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' && steps.harness.outcome == 'success' && steps.simulator_boot.outcome == 'success' }}
        env:
          SIMULATOR_DESTINATION: platform=iOS Simulator,id=${{ steps.simulator_boot.outputs.simulator_id }}
        run: bash scripts/check-native-reader-full-validation.sh
      - name: Export bounded structured test records after the native attempt
        id: xcresult_export
        if: ${{ !cancelled() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure') }}
        run: python3 scripts/export-native-xcresult.py
      - name: Collect only bounded case-attributed preroll crash excerpts
        if: ${{ !cancelled() && steps.xcresult_export.outcome == 'success' }}
        run: python3 scripts/export-preroll-crash-evidence.py --simulator-udid "${{ steps.simulator_boot.outputs.simulator_id }}" --export-succeeded
      - name: Independently require the final pinned native and UI identities after the attempt
        id: full_evidence
        if: ${{ !cancelled() && steps.source_pin.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('evidence', 'scripts/verify-native-test-log.py')
          evidence = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(evidence)
          expected = evidence.source_manifest(Path('.'))
          native = {identity for identity in expected if identity.startswith('OfflineTikTokPlayerTests.')}
          ui = {identity for identity in expected if identity.startswith('OfflineTikTokPlayerUITests.')}
          expected_native, expected_ui = '265', '1'
          if not all(value.isdigit() and int(value) > 0 for value in (expected_native, expected_ui)):
              raise SystemExit('Final committed full-manifest counts are required.')
          if len(native) != int(expected_native) or len(ui) != int(expected_ui) or native | ui != expected:
              raise SystemExit(f'Pinned full manifest must equal native={expected_native} ui={expected_ui}; found native={len(native)} ui={len(ui)} total={len(expected)}')
          evidence.verify_log(Path('artifacts/native/xcodebuild-test.log').read_text(), expected)
          print(f'FULL source-manifest evidence native={expected_native} ui={expected_ui}; original guards retained; physical-device acceptance remains separate')
          PY
      - name: Compile the qualified full source as an unsigned Release app
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.full_evidence.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SWIFTC_MAXIMUM_DETERMINISM: '1'
        run: |
          set -euo pipefail
          xcodebuild -project ios/OfflineTikTokPlayer.xcodeproj -scheme OfflineTikTokPlayer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath artifacts/UnsignedReleaseDerivedData -jobs 1 \
            SWIFTC_MAXIMUM_DETERMINISM=1 SWIFT_USE_PARALLEL_WHOLE_MODULE_OPTIMIZATION=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee artifacts/native/unsigned-release-build.log
          grep -Fxq '** BUILD SUCCEEDED **' artifacts/native/unsigned-release-build.log
          printf '%s\n' 'UnsignedReleaseBuildEvidence configuration=Release sdk=iphoneos action=build maximumBuildJobs=1 signed=false archived=false published=false'
