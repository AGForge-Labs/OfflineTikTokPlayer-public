name: Verify held video frames, loop audio and cold launch
on:
  push:
    branches: [codex/verify-current-player-startup]
permissions:
  contents: read
jobs:
  portable:
    if: github.repository == 'Galaxybigbird/OfflineTikTokPlayer-public' && !github.event.repository.private
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the 35 existing XCTest results against the identical runtime and fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5ff22edfaa2de9bab12f63ffc7a1ddc7b2e76246
          api=repos/Galaxybigbird/OfflineTikTokPlayer-public/actions
          gh api "$api/runs/44714238152" > "$RUNNER_TEMP/previous-run.json"
          gh api "$api/runs/44714238152/jobs" > "$RUNNER_TEMP/previous-jobs.json"
          # The log includes ANSI colors. Never print its raw terminal controls.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/previous-native.log" "https://api.github.com/$api/jobs/136214095858/logs"
          python3 -B scripts/verify-held-picture-results.py "$RUNNER_TEMP/previous-run.json" "$RUNNER_TEMP/previous-jobs.json" "$RUNNER_TEMP/previous-native.log"
      - name: Reproduce the shipped half-second blind spot and check the audio baseline
        run: |
          set -euo pipefail
          shipped=05c050661162801d911254582f94d7f778ad4b76
          git diff --exit-code "$shipped" HEAD -- ios/OfflineTikTokPlayer/Playback/ContinuousAudioPlayer.swift ios/PlayerCore/Sources/PlayerCore/{ContinuousPCMRenderer,VideoFrameRequest}.swift
          probe="$RUNNER_TEMP/shipped-picture-progress.swift"
          git show "$shipped:ios/PlayerCore/Sources/PlayerCore/VideoImageProgress.swift" > "$probe"
          cat >> "$probe" <<'SWIFT'
          var watch = VideoImageProgress()
          var firstIntervention: Double?
          for tick in 0...240 {
              let t = Double(tick) / 60
              let elapsed = t - 1
              if watch.shouldRecover(now: t, playbackPosition: t, displayedPosition: min(1, t)) {
                  firstIntervention = elapsed
                  break
              }
          }
          guard let delay = firstIntervention, delay >= 1.5 else { fatalError("Expected the shipped held-picture behavior") }
          print("36.1 old code: soundtrack advanced while picture held, first intervention after", delay, "seconds")
          SWIFT
          swift "$probe"
      - name: Check project, Swift syntax and playback core
        run: |
          set -euo pipefail
          python3 -B scripts/generate-ios-project.py --check
          python3 -B tests/validation-shell/test_simulator_boot_preflight.py
          python3 -B tests/validation-shell/test_simulator_destination_resolution.py
          swiftc -frontend -parse -D DEBUG ios/OfflineTikTokPlayer/App/{AppModel,OfflineTikTokPlayerApp}.swift ios/OfflineTikTokPlayer/Playback/{ContinuousAudioPlayer,ContinuousPictureInPicture,PlaybackBuffer,PlaybackService,StreamingVideoFrames}.swift ios/OfflineTikTokPlayerTests/{AudioOnlyContinuityTests,ContinuousAudioPlayerTests,ContinuousPictureInPictureTests,NativeMediaTests,NativeStreamingPlaybackTests,PictureRecoveryTests,PlaybackContinuityTests,PlaybackSelectionVideoRegressionTests,StreamingVideoFramesTests,VideoPresentationContinuityTests}.swift ios/OfflineTikTokPlayerUITests/PlayerShellTests.swift
          bash scripts/test-core.sh
          bash scripts/test-native-cloud.sh
  simulator:
    if: github.repository == 'Galaxybigbird/OfflineTikTokPlayer-public' && !github.event.repository.private
    needs: portable
    runs-on: macos-26
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify loop and switch sequences with the simulator compositor
        run: |
          set -euo pipefail
          udid="$(python3 -B scripts/capture-simulator-test-frames.py --hosted-inventory --resolve-destination 'platform=iOS Simulator,name=iPhone 17 Pro Max')"
          [[ "$udid" =~ ^[0-9a-fA-F-]{36}$ ]]
          work=artifacts/loop-picture
          mkdir -p "$work"
          capture_pid=''
          cleanup_capture() {
            if [ -n "$capture_pid" ]; then
              kill "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
              capture_pid=''
            fi
          }
          trap cleanup_capture EXIT
          recovery=OfflineTikTokPlayerTests/PictureRecoveryTests
          selection=OfflineTikTokPlayerTests/PlaybackSelectionVideoRegressionTests
          boot_simulator() {
            python3 -B scripts/ensure-simulator-booted.py --udid "$udid" --hosted-inventory
          }
          start_capture() {
            local capture_log="$work/capture-helper.log"
            python3 -u scripts/capture-simulator-test-frames.py \
              --udid "$udid" --lifetime 1200 >"$capture_log" 2>&1 &
            capture_pid=$!
            for ((attempt=0; attempt<100; attempt++)); do
              kill -0 "$capture_pid" 2>/dev/null || { cat "$capture_log"; return 1; }
              if grep -Fq '"eventCode": 0' "$capture_log"; then return 0; fi
              sleep 0.1
            done
            cat "$capture_log"
            return 1
          }
          build_cases() {
            local phase="$1" project="${2:-ios/OfflineTikTokPlayer.xcodeproj}" derived="${3:-$work/Derived}"
            xcodebuild build-for-testing -project "$project" -scheme OfflineTikTokPlayer \
              -configuration Debug -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$derived" -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/$work/Derived/SourcePackages" \
              -jobs 2 CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$work/$phase-build.log" || return
            local plans=("$derived/Build/Products/"*.xctestrun)
            test "${#plans[@]}" = 1 && test -f "${plans[0]}" || return
            plan="${plans[0]}"
          }
          run_cases() {
            local phase="$1" selector
            shift
            local args=()
            for selector in "$@"; do args+=("-only-testing:$selector"); done
            run_once() {
              xcodebuild test-without-building -xctestrun "$plan" -destination "platform=iOS Simulator,id=$udid" \
                -resultBundlePath "$work/$phase.xcresult" -parallel-testing-enabled NO \
                -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 90 \
                "${args[@]}" 2>&1 | tee "$work/$phase.log"
            }
            local status=0
            run_once || status=$?
            if (( status != 0 )) \
              && grep -Fq 'operation never finished bootstrapping' "$work/$phase.log" \
              && ! grep -Eq 'Test Case .* started' "$work/$phase.log"; then
              echo "Restarting the test simulator once after a pre-test bootstrap abort."
              mv "$work/$phase.log" "$work/$phase-bootstrap.log" || return
              if [[ -d "$work/$phase.xcresult" ]]; then
                mv "$work/$phase.xcresult" "$work/$phase-bootstrap.xcresult" || return
              fi
              cleanup_capture
              xcrun simctl shutdown "$udid" || return
              boot_simulator || return
              start_capture || return
              status=0
              run_once || status=$?
            fi
            return "$status"
          }
          check_cases() {
            local phase="$1" result="$2"
            shift 2
            xcrun xcresulttool get test-results tests --path "$work/$phase.xcresult" > "$work/$phase.json"
            python3 - "$work/$phase.json" "$result" "$@" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, result, *selectors = sys.argv[1:]
          expected = {selector.split('/', 1)[1] for selector in selectors}
          nodes = list(json.loads(Path(report).read_text())['testNodes'])
          while nodes:
              node = nodes.pop()
              nodes.extend(node.get('children', ()))
              if node['nodeType'] == 'Test Case':
                  identity = node['nodeIdentifier'].removesuffix('()')
                  assert identity in expected, node
                  assert node['result'] == result, node
                  expected.remove(identity)
          assert not expected, expected
          print(Path(report).stem, result, len(selectors))
          PY
          }
          run_checked() {
            local phase="$1"
            shift
            run_cases "$phase" "$@" && check_cases "$phase" Passed "$@"
          }
          boot_simulator
          build_cases Fixed
          start_capture
          # Run the outstanding test with a fresh host, then after loop and
          # rapid-switch activity. Both tests in the edited suite execute here.
          gate_status=0
          run_checked Cold "$selection/testIssuedVideoSeekCompletionCannotActivateStaleABeforeNaturalBVisitAdoption" || gate_status=1
          run_checked AfterChurn "$recovery/testRepeatedLoopsAndRapidReversalsKeepDisplayingTheCurrentVideo" \
            "$selection/testIssuedVideoSeekCompletionCannotActivateStaleABeforeNaturalBVisitAdoption" \
            "$selection/testRapidABASupersedesPendingVideoSeekAndPreservesExplicitPause" || gate_status=1
          exit "$gate_status"
