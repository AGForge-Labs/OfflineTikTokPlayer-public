name: Revalidate completed native video evidence
on:
  push:
    branches: [codex/native-video-evidence]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-video-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.actor_id == '105477711' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check bounded evidence validation locally
        run: python3 -B -m unittest discover -s tests/validation-shell -p test_video_revalidation.py
      - name: Verify the frozen completed native execution without Apple credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/revalidate-native-video.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: revalidated-native-video
          path: artifacts/native-video-revalidation/report.json
          retention-days: 1
