name: Reproduce the loop audio discontinuity
on:
  push:
    branches: [codex/loop-audio-repro]
permissions:
  contents: read
jobs:
  audio:
    if: github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: swift test --jobs 2 --package-path ios/PlayerCore --filter ContinuousPCMTests.testRepeatOneSmoothsAHardStereoCutWithoutChangingDurationOrTheCleanChannel
