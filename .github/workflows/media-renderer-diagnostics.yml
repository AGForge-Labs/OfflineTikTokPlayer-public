name: Public renderer identity diagnostics
on:
  push:
    branches: [codex/media-renderer-diagnostics]
permissions:
  contents: read
concurrency:
  group: renderer-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 12
    env:
      SWIFTC_MAXIMUM_DETERMINISM: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source and project
        run: |
          git rev-parse HEAD
          xcodebuild -version
          python3 scripts/generate-ios-project.py --check
      - name: Diagnostic only - actual renderer buffer identity and clock lead
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/renderer
          excluded="$(python3 -c 'from pathlib import Path; chosen={"VideoPresentationContinuityTests.swift", "PictureRecoveryTests.swift"}; files=list(Path("ios/OfflineTikTokPlayerTests").glob("*.swift")); assert chosen <= {p.name for p in files}; print(" ".join(sorted(p.name for p in files if p.name not in chosen)))')"
          xcodebuild -project ios/OfflineTikTokPlayer.xcodeproj -scheme OfflineTikTokPlayer -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath artifacts/RendererDerived -resultBundlePath artifacts/renderer/Renderer.xcresult \
            -jobs 1 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO "EXCLUDED_SOURCE_FILE_NAMES=$excluded" \
            -only-testing:OfflineTikTokPlayerTests/VideoPresentationContinuityTests/testRendererPixelIdentityAndMetadataAfterActualIncomingDisplay \
            -only-testing:OfflineTikTokPlayerTests/VideoPresentationContinuityTests/testForegroundFeedDoesNotDropEveryOtherFrameOfSixtyFPSVideo \
            -only-testing:OfflineTikTokPlayerTests/VideoPresentationContinuityTests/testNativeClockLeadInsideDriftToleranceStillProducesDisplayableFrames \
            test 2>&1 | tee artifacts/renderer/xcodebuild.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-identity-diagnostics
          path: artifacts/renderer
          retention-days: 3
