name: Public AAC native-rate API proof (not iOS acceptance)
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: 'Run the unsigned synthetic macOS44.1k AAC API comparison on a standard public runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gap-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-aac-api-only:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/gapless-profile' && inputs.approve_runner }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source and Xcode identity
        run: |
          git rev-parse HEAD
          xcodebuild -version
      - name: Whole-source native44.1k AAC references and current-reader baseline
        run: bash scripts/check-aac44100-probe.sh
      - name: Preserve synthetic API results briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gap-profile-evidence
          path: artifacts/native/aac44100-probe.log
          if-no-files-found: ignore
          retention-days: 1
