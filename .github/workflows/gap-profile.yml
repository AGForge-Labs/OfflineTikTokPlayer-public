name: Public focused playback checks
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: 'Run the unsigned source-only playback diagnostic on a standard public runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gap-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  initial-main-thread:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/gapless-profile' && inputs.approve_runner }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Observe one missing initial MainActor heartbeat
        run: bash scripts/check-initial-main-thread-stall.sh
      - name: Retain synthetic capture evidence briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: initial-main-thread-evidence
          path: |
            artifacts/native/*.log
            artifacts/native/*.xcresult
            artifacts/DerivedData/Build/Products/Debug-iphonesimulator/OfflineTikTokPlayer.app.dSYM
            artifacts/DerivedData/Build/Products/Debug-iphonesimulator/OfflineTikTokPlayer.app/PlugIns/OfflineTikTokPlayerTests.xctest.dSYM
          if-no-files-found: warn
          retention-days: 1
