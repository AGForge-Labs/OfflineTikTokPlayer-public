name: Public focused playback checks
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: 'Run the unsigned source-only playback diagnostic on a standard public runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gap-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-release:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/gapless-profile' && inputs.approve_runner }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Read diagnostic launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Read immutable playback candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9489d3b3ae85cb41b5ef4f56633dcf41b36505af
          path: candidate
          persist-credentials: false
      - name: Compile unsigned Release app for iPhone
        working-directory: candidate
        run: bash ../harness/scripts/check-unsigned-release.sh
      - name: Retain compile evidence briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-release-compile-evidence
          path: |
            candidate/artifacts/native/release-identity.log
            candidate/artifacts/native/xcodebuild-release.log
            candidate/artifacts/native/release-product.log
            candidate/artifacts/native/UnsignedRelease.xcresult
          if-no-files-found: warn
          retention-days: 1
