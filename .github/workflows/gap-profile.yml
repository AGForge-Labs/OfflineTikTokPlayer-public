name: Public focused playback checks
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: 'Run the unsigned source-only playback diagnostic on a standard public runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gap-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: macOS audio-file API probe only
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/gapless-profile' && inputs.approve_runner }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source and Xcode identity
        run: |
          git rev-parse HEAD
          xcodebuild -version
      - name: Standalone macOS API probe (not iOS playback acceptance)
        run: |
          set -euo pipefail
          mkdir -p artifacts/native
          swiftc -parse-as-library -swift-version 5 scripts/probe-audio-file.swift -o artifacts/native/audio-file-probe
          artifacts/native/audio-file-probe 2>&1 | tee artifacts/native/audio-file-probe.log
      - name: Preserve synthetic native evidence briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gap-profile-evidence
          path: |
            artifacts/native/audio-file-probe.log
            artifacts/native/xcodebuild-test.log
            artifacts/native/*.xcresult
          if-no-files-found: ignore
          retention-days: 1
