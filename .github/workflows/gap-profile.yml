name: Public focused playback checks
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: 'Run the unsigned source-only playback diagnostic on a standard public runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: gap-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preparation-stacks:
    if: ${{ github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && github.event.repository.private == false && github.ref == 'refs/heads/diagnostic/gapless-profile' && inputs.approve_runner }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9489d3b3ae85cb41b5ef4f56633dcf41b36505af
          path: candidate
          persist-credentials: false
      - name: Identify the unchanged candidate and exercise sampler rejection guards
        run: |
          git -C harness rev-parse HEAD
          git -C candidate rev-parse HEAD
          xcodebuild -version
          python3 harness/tests/validation-shell/test_preparation_stack_sampler.py
      - name: Reuse only Native35 compiled products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12602932379'
          merge-multiple: true
          repository: AGForge-Labs/OfflineTikTokPlayer-public
          run-id: 40204029345
          github-token: ${{ github.token }}
          path: candidate/artifacts/native
          digest-mismatch: error
      - name: Sample one existing unsigned native case near its observed start
        run: bash harness/scripts/check-preparation-stacks.sh "$GITHUB_WORKSPACE/candidate"
      - name: Retain only synthetic native and stack evidence briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preparation-stack-evidence
          path: |
            candidate/artifacts/native/xcodebuild-test.log
            candidate/artifacts/native/preparation-stacks/
            candidate/artifacts/native/*.xcresult
          if-no-files-found: ignore
          retention-days: 1
