name: Phone playback portable regressions
on:
  push:
    branches: [fix/phone-playback-reliability]
    paths: ['ios/PlayerCore/**', '.github/workflows/phone-core.yml']
permissions:
  contents: read
jobs:
  core:
    if: github.repository == 'AGForge-Labs/OfflineTikTokPlayer-public' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Actual compiled portable playback tests
        run: swift test --jobs 1 --package-path ios/PlayerCore --scratch-path artifacts/swift-build
